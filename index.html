<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicios JavaScript - Parte 2</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 30px;
            transition: background-color 0.5s ease; /* Para que el cambio de color sea suave */
            line-height: 1.6;
        }
        section {
            background: rgba(255, 255, 255, 0.8);
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 500px;
        }
        h2 { margin-top: 0; color: #333; }
        input { display: block; margin: 10px 0; padding: 8px; width: 90%; }
        button { 
            padding: 10px 20px; 
            cursor: pointer; 
            background-color: #007bff; 
            color: white; 
            border: none; 
            border-radius: 5px;
            font-weight: bold;
        }
        button:hover { background-color: #0056b3; }
        #resultadoIMC { font-weight: bold; margin-top: 15px; color: #2c3e50; }
    </style>
</head>
<body>

    <h1>Segunda Tanda de Ejercicios</h1>

    <section>
        <h2>1. Cambiar Color de Fondo</h2>
        <p>Haz clic para cambiar el color de la página aleatoriamente.</p>
        <button onclick="cambiarFondo()">¡Cambiar Color!</button>
    </section>

    <section>
        <h2>2. Calculadora de IMC</h2>
        <label>Peso (kg):</label>
        <input type="number" id="peso" placeholder="Ej: 75" step="0.1">
        
        <label>Altura (m):</label>
        <input type="number" id="altura" placeholder="Ej: 1.75" step="0.01">
        
        <button onclick="calcularIMC()">Calcular IMC</button>
        <div id="resultadoIMC"></div>
    </section>

    <section>
        <h2>3. Confirmación de Acción</h2>
        <p>Prueba el cuadro de diálogo de confirmación.</p>
        <button onclick="confirmarAccion()">Continuar...</button>
    </section>

    <script>
        // --- 1. FUNCIÓN CAMBIO DE COLOR ---
        function cambiarFondo() {
            // Genera un color aleatorio en formato hexadecimal
            const colorAleatorio = '#' + Math.floor(Math.random()*16777215).toString(16);
            document.body.style.backgroundColor = colorAleatorio;
        }

        // --- 2. FUNCIÓN CALCULAR IMC ---
        function calcularIMC() {
            const peso = parseFloat(document.getElementById('peso').value);
            const altura = parseFloat(document.getElementById('altura').value);
            const display = document.getElementById('resultadoIMC');

            if (peso > 0 && altura > 0) {
                // Fórmula: peso / altura^2
                const imc = peso / (altura * altura);
                display.innerText = "Tu IMC es: " + imc.toFixed(2);
                display.style.color = "black";
            } else {
                display.innerText = "Por favor, ingresa valores válidos.";
                display.style.color = "red";
            }
        }

        // --- 3. FUNCIÓN CONFIRMACIÓN ---
        function confirmarAccion() {
            // window.confirm devuelve true (Aceptar) o false (Cancelar)
            const respuesta = confirm("¿Estás seguro de que deseas continuar?");
            
            if (respuesta) {
                alert("Continuando...");
            } else {
                alert("Cancelando...");
            }
        }
    </script>

</body>
</html>
